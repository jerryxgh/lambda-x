# Migrated from ~/.config/alacritty/alacritty.toml
font_family Menlo
font_size 14
modify_font cell_height 9px
modify_font cell_width -1px
window_padding_width 0
placement_strategy top-left
background_opacity 1
scrollback_lines 10000
wheel_scroll_multiplier 3
macos_option_as_alt both
shell /bin/zsh -l
startup_session alacritty.session
mouse_hide_wait -1
enable_audio_bell no
cursor none
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.75
cursor_stop_blinking_after 0
selection_foreground none
selection_background none
clipboard_control write-clipboard read-clipboard
copy_on_select clipboard
foreground #d8d8d8
background #181818
color0 #181818
color1 #ac4242
color2 #90a959
color3 #f4bf75
color4 #6a9fb5
color5 #aa759f
color6 #75b5aa
color7 #d8d8d8
color8 #6b6b6b
color9 #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

# Keyboard shortcuts
map ctrl+semicolon send_text all \x1b\x5b\x32\x37\x3b\x35\x3b\x35\x39\x7e
map cmd+semicolon send_text all \x1b\x5b\x32\x37\x3b\x35\x3b\x35\x39\x7e
map cmd+a send_text all \x01
map cmd+b send_text all \x02
map cmd+c send_text all \x03
map cmd+d send_text all \x04
map cmd+e send_text all \x05
map cmd+f send_text all \x06
map cmd+g send_text all \x07
map cmd+h send_text all \x08
map cmd+i send_text all \x09
map cmd+j send_text all \x0a
map cmd+k send_text all \x0b
map cmd+l send_text all \x0c
map cmd+m send_text all \x0d
map cmd+n send_text all \x0e
map cmd+o send_text all \x0f
map cmd+p send_text all \x10
confirm_os_window_close 0
map cmd+q quit
map cmd+r send_text all \x12
map cmd+s send_text all \x13
map cmd+t send_text all \x14
map cmd+u send_text all \x15
map cmd+w send_text all \x17
map cmd+x send_text all \x18
map cmd+y send_text all \x19
map cmd+z send_text all \x1a
map ctrl+slash send_text all \x1f
map cmd+slash send_text all \x1f
map cmd+shift+n new_os_window
map cmd+shift+t new_tab
map cmd+shift+up previous_tab
map cmd+shift+down next_tab
map cmd+shift+c copy_to_clipboard
map cmd+shift+v paste_from_clipboard
map cmd+shift+equal change_font_size current +0.5
map cmd+shift+minus change_font_size current -0.5
map cmd+shift+0 change_font_size current 0
map cmd+left send_text all \x1b\x1f\x54\x62\x1f
map cmd+shift+left send_text all \x1b\x1f\x54\x63\x1f
map cmd+right send_text all \x1b\x1f\x55\x42\x1f
map cmd+shift+right send_text all \x1b\x1f\x55\x43\x1f

# Mouse font size controls
mouse_map ctrl+left press ungrabbed,grabbed change_font_size current +0.5
mouse_map ctrl+right press ungrabbed,grabbed change_font_size current -0.5
mouse_map ctrl+middle press ungrabbed,grabbed change_font_size current 0
